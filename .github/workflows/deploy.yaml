name: Laravel 13 CI/CD Deployment

on:
  push:
    branches: [ "main" ] # Triggers only when code is pushed to your main production branch

jobs:
  laravel-tests:
    name: Run Tests & Build Assets
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite, bcmath, filter, zip
        tools: composer:v2
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Copy Environment File
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Install NPM Dependencies & Build Assets
      run: |
        npm ci
        npm run build

    - name: Run Migrations & Tests
      run: |
        touch database/database.sqlite
        php artisan migrate --force
        php artisan test
      env:
        APP_ENV: testing
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
        CACHE_STORE: array
        SESSION_DRIVER: array
        QUEUE_CONNECTION: sync
        MAIL_MAILER: array

  deploy:
    name: Deploy to Live Hosting
    needs: laravel-tests # Ensures deployment only happens if tests pass successfully
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite, bcmath, filter, zip
        tools: composer:v2
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    # vendor/ is gitignored, so it must be built here (production deps only) and
    # shipped to the server separately, since the server does not have Composer.
    - name: Install Production Composer Dependencies
      run: composer install --no-dev --no-scripts --optimize-autoloader --prefer-dist --no-ansi --no-interaction --no-progress

    - name: Build Production Assets
      run: |
        npm ci
        npm run build

    - name: Package Vendor Directory
      run: tar -czf vendor.tar.gz vendor

    - name: Upload Vendor Package to Server
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        source: "vendor.tar.gz"
        target: "/home/fsd-pendaftaranticketkonser/htdocs/pendaftaranticketkonser.fsd.my.id/"
        overwrite: true

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        script: |
          set -eu
          cd /home/fsd-pendaftaranticketkonser/htdocs/pendaftaranticketkonser.fsd.my.id
          git pull origin main
          test -f vendor.tar.gz
          rm -rf vendor.deploy
          mkdir vendor.deploy
          tar -xzf vendor.tar.gz -C vendor.deploy
          test -f vendor.deploy/vendor/autoload.php
          rm -rf vendor.previous
          if [ -d vendor ]; then mv vendor vendor.previous; fi
          mv vendor.deploy/vendor vendor
          rm -rf vendor.previous
          rm -f vendor.tar.gz
          rm -f bootstrap/cache/*.php
          php artisan package:discover --ansi
          php artisan migrate --force
          php artisan config:cache
